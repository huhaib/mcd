<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tax Invoice Pro</title>
<style>
:root{--primary:#2457d6;--dark:#172033;--bg:#f4f7fb;--card:#fff;--muted:#6b7280;--line:#e5eaf2;--danger:#dc3545;--success:#16834b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--dark)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--primary);color:white;font-weight:600}button.secondary{background:#e9eefb;color:#234ba8}button.danger{background:#ffe8eb;color:#b42335}button.ghost{background:transparent;color:var(--dark)}.hidden{display:none!important}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#111a2d;color:white;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:800;padding:8px 10px 25px}.brand small{display:block;font-size:11px;color:#aab6d1;margin-top:5px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e9;margin:5px 0;padding:13px;border-radius:10px}.nav button.active,.nav button:hover{background:#263a69;color:#fff}.main{flex:1;min-width:0}.topbar{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.content{padding:28px;max-width:1600px;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.page-title h1{margin:0;font-size:28px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px #14213d08}.metric{font-size:28px;font-weight:800;margin-top:10px}.metric-label{color:var(--muted);font-size:13px}.section{margin-top:22px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:15px}.toolbar input,.toolbar select{max-width:260px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:700;color:#526078}.field input,.field select,.field textarea,input,select,textarea{width:100%;border:1px solid #d9e1ef;border-radius:9px;padding:10px;background:white;min-width:0}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.span-2{grid-column:span 2}.span-4{grid-column:1/-1}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:14px}.data-table{width:100%;border-collapse:collapse;min-width:700px}.data-table th,.data-table td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.data-table th{background:#f7f9fd;color:#53617a;font-size:12px}.data-table tr:last-child td{border-bottom:0}.pill{padding:5px 9px;border-radius:30px;background:#e9f7ef;color:var(--success);font-size:11px;font-weight:700}.invoice-lines input{padding:8px}.totals{margin-left:auto;max-width:360px;display:grid;gap:10px}.total-row{display:flex;justify-content:space-between;gap:20px}.total-row.grand{font-size:20px;font-weight:800;border-top:2px solid var(--dark);padding-top:12px}.modal{position:fixed;inset:0;background:#07112688;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-box{background:white;border-radius:18px;padding:24px;max-width:800px;width:100%;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.empty{text-align:center;padding:45px;color:var(--muted)}.print-only{display:none}
@media(max-width:1000px){.sidebar{width:210px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.app{display:block}.sidebar{width:100%;height:auto;position:static;padding:10px}.brand{padding:8px}.nav{display:flex;overflow:auto;gap:5px}.nav button{white-space:nowrap;width:auto;margin:0}.topbar{padding:0 15px}.content{padding:15px}.grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.page-title h1{font-size:22px}}
@media print{body{background:white}.sidebar,.topbar,.no-print{display:none!important}.main{width:100%}.content{padding:0}.print-only{display:block}.card{box-shadow:none;border:0}.page{display:block!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">Tax Invoice Pro<small>Saudi Arabia • India GST</small></div>
<nav class="nav" id="nav"></nav>
</aside>
<main class="main">
<header class="topbar"><div><b id="branchLabel">Main Branch</b><div class="muted" id="dateLabel"></div></div><div><button class="secondary" id="langBtn">العربية</button></div></header>
<div class="content" id="appContent"></div>
</main>
</div>
<div class="modal hidden" id="modal"><div class="modal-box" id="modalBox"></div></div>
<script>
const $=s=>document.querySelector(s);
const state={page:'dashboard',lang:'en',country:'sa',invoiceType:'sales',editingId:null};
const db=JSON.parse(localStorage.getItem('taxInvoiceProDB')||'null')||{settings:{company:'Your Company Name',taxMode:'sa',branch:'Main Branch',currency:'SAR'},products:[],customers:[],suppliers:[],invoices:[],purchases:[],returns:[],branches:[{id:'b1',name:'Main Branch'}],users:[{id:'u1',name:'Admin',role:'Admin'}],seq:1001};
const save=()=>localStorage.setItem('taxInvoiceProDB',JSON.stringify(db));
const money=n=>Number(n||0).toFixed(2)+' '+(db.settings.currency||'SAR');
const t=(en,ar)=>state.lang==='en'?en:ar;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){const items=[['dashboard','▦','Dashboard','لوحة التحكم'],['invoice','＋','New Invoice','فاتورة جديدة'],['invoices','▤','Sales History','سجل المبيعات'],['purchases','⇩','Purchase Invoices','فواتير الشراء'],['products','▥','Products & Stock','المنتجات والمخزون'],['contacts','♙','Customers & Suppliers','العملاء والموردون'],['reports','◔','Reports','التقارير'],['settings','⚙','Settings','الإعدادات']];$('#nav').innerHTML=items.map(x=>`<button class="${state.page===x[0]?'active':''}" data-page="${x[0]}">${x[1]} &nbsp; ${t(x[2],x[3])}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()})}
function openSalesInvoice(){state.page='invoice';state.invoiceType='sales';state.editingId=null;render()} function openPurchaseInvoice(){state.page='invoice';state.invoiceType='purchase';state.editingId=null;render()} function salesInvoices(){return db.invoices.filter(x=>x.type!=='purchase');}
function purchaseInvoices(){return db.invoices.filter(x=>x.type==='purchase');}
function render(){nav();$('#branchLabel').textContent=db.settings.branch;$('#dateLabel').textContent=new Date().toLocaleDateString();const c=$('#appContent');c.innerHTML='';({dashboard,invoice,invoices,purchases,products,contacts,reports,settings}[state.page]||dashboard)(c)}
function title(h,sub,actions=''){return `<div class="page-title"><div><h1>${h}</h1><div class="muted">${sub}</div></div><div class="toolbar no-print">${actions}</div></div>`}
function dashboard(c){const sales=db.invoices.filter(x=>x.status!=='void').reduce((a,x)=>a+x.total,0),items=db.products.reduce((a,x)=>a+x.stock,0);c.innerHTML=title(t('Dashboard','لوحة التحكم'),t('Business overview','نظرة عامة على الأعمال'))+`<div class="grid"><div class="card"><div class="metric-label">${t('Total Sales','إجمالي المبيعات')}</div><div class="metric">${money(sales)}</div></div><div class="card"><div class="metric-label">${t('Invoices','الفواتير')}</div><div class="metric">${salesInvoices().length}</div></div><div class="card"><div class="metric-label">${t('Products','المنتجات')}</div><div class="metric">${db.products.length}</div></div><div class="card"><div class="metric-label">${t('Stock Units','وحدات المخزون')}</div><div class="metric">${items}</div></div></div><div class="section card"><h3>${t('Recent Invoices','أحدث الفواتير')}</h3>${invoiceTable(db.invoices.slice(-8).reverse())}</div>`}
function invoiceTable(list){if(!list.length)return '<div class="empty">No records yet</div>';return `<div class="table-wrap"><table class="data-table"><thead><tr><th>No.</th><th>Date</th><th>Customer</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.no)}</td><td>${esc(x.date)}</td><td>${esc(x.customerName)}</td><td>${money(x.total)}</td><td><span class="pill">${esc(x.status||'Saved')}</span></td><td><button class="secondary" onclick="printInvoice('${x.id}')">Print</button> <button class="secondary" onclick="editInvoice('${x.id}')">Edit</button> <button class="danger" onclick="deleteInvoice('${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function invoice(c){
const isPurchase=state.invoiceType==='purchase';
const list=isPurchase?db.suppliers:db.customers;
const no='INV-'+db.seq;
let lineData=state.draftLines||[];
c.innerHTML=`<div class="page-title"><div><h1>${isPurchase?'Purchase Invoice':'New Sales Invoice'}</h1><div class="muted">Create and save invoices</div></div><div class="toolbar no-print"><button class="secondary" id="switchType">${isPurchase?'Sales Invoice':'Purchase Invoice'}</button></div></div>
<div class="card"><div class="form-grid">
<div class="field span-2"><label>Customer / Supplier</label><select id="party"><option value="">Walk-in / Select</option>${list.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
<div class="field"><label>Invoice Number</label><input id="invNo" value="${no}" readonly></div><div class="field"><label>Date</label><input id="invDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
<div class="field span-2"><label>Scan Barcode / Search Product</label><input id="productSearchBox" autocomplete="off" placeholder="Enter barcode or product name..."><div id="productSuggestions" class="hidden" style="position:relative;background:#fff;border:1px solid #d9e1ef;border-radius:10px;max-height:260px;overflow:auto;z-index:20"></div></div>
<div class="field"><label>Tax Country</label><select id="taxCountry"><option value="sa">Saudi Arabia — VAT 15%</option><option value="in">India — GST</option></select></div><div class="field"><label>Branch</label><input value="${esc(db.settings.branch)}" readonly></div>
</div><div class="section"><div class="toolbar"><h3 style="margin-right:auto">Invoice Items</h3><button id="addLine">+ Add Item</button></div><div class="table-wrap"><table class="data-table invoice-lines"><thead><tr><th>#</th><th>Item</th><th>Code</th><th>Qty</th><th>Price</th><th>VAT %</th><th>Total</th><th>Action</th></tr></thead><tbody id="lines"></tbody></table></div></div>
<div class="section"><div class="field"><label>Notes</label><textarea id="invoiceNotes" rows="4"></textarea></div><div class="totals"><div class="total-row"><span>Subtotal</span><b id="subtotal">0.00</b></div><div class="total-row"><span>Tax</span><b id="taxTotal">0.00</b></div><div class="total-row grand"><span>Grand Total</span><b id="grandTotal">0.00</b></div></div></div>
<div class="toolbar no-print" style="justify-content:flex-end;margin-top:20px"><button class="secondary" id="clearInvoice">Clear</button><button id="saveInvoice">Save Invoice</button><button class="secondary" id="printDraft">Print / PDF</button><button class="secondary" id="shareDraft">WhatsApp</button></div></div>`;
const draw=()=>{$('#lines').innerHTML=lineData.length?lineData.map((r,i)=>{const p=db.products.find(p=>p.id===r.productId);return `<tr><td>${i+1}</td><td><select class="prod" data-i="${i}"><option value="">Select product</option>${db.products.map(p=>`<option value="${p.id}" ${p.id===r.productId?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button class="secondary" style="padding:4px 7px;font-size:11px" onclick="productModal('${r.productId}')">Edit Product</button></td><td>${esc(p?.code||'—')}</td><td><input class="qty" data-i="${i}" type="number" min="1" value="${r.qty}"></td><td><input class="price" data-i="${i}" type="number" min="0" step=".01" value="${r.price}"></td><td><input class="tax" data-i="${i}" type="number" min="0" value="${r.tax}"></td><td>${money(r.qty*r.price*(1+r.tax/100))}</td><td><button class="danger remove" data-i="${i}">×</button></td></tr>`}).join(''):'<tr><td colspan="8" class="empty">Add a product to begin.</td></tr>';bindLines();calc()};
const bindLines=()=>{$('#lines').querySelectorAll('.prod').forEach(e=>e.onchange=()=>{const r=lineData[e.dataset.i];r.productId=e.value;const p=db.products.find(x=>x.id===e.value);if(p)r.price=Number(isPurchase?(p.purchasePrice??p.price):(p.salePrice??p.price));draw()});['qty','price','tax'].forEach(k=>$('#lines').querySelectorAll('.'+k).forEach(e=>e.oninput=()=>{lineData[e.dataset.i][k]=Number(e.value)||0;calc()}));$('#lines').querySelectorAll('.remove').forEach(e=>e.onclick=()=>{lineData.splice(e.dataset.i,1);draw()})};
const calc=()=>{let sub=0,tax=0;lineData.forEach(r=>{sub+=r.qty*r.price;tax+=r.qty*r.price*r.tax/100});$('#subtotal').textContent=money(sub);$('#taxTotal').textContent=money(tax);$('#grandTotal').textContent=money(sub+tax)};
const addProduct=(p)=>{if(!p)return;let r=lineData.find(x=>x.productId===p.id);if(r)r.qty++;else lineData.push({productId:p.id,qty:1,price:Number(isPurchase?(p.purchasePrice??p.price):(p.salePrice??p.price))||0,tax:15});draw();$('#productSearchBox').value=''};
$('#addLine').onclick=()=>{lineData.push({productId:'',qty:1,price:0,tax:15});draw()};
const searchBox=$('#productSearchBox');
const suggestionBox=$('#productSuggestions');
let searchMatches=[],searchIndex=0;
function renderProductSuggestions(){
  const q=searchBox.value.trim().toLowerCase();
  searchMatches=db.products.filter(p=>String(p.code||'').toLowerCase().includes(q)||String(p.name||'').toLowerCase().includes(q)).slice(0,15);
  if(!q||!searchMatches.length){suggestionBox.classList.add('hidden');suggestionBox.innerHTML='';return;}
  suggestionBox.innerHTML=searchMatches.map((p,i)=>`<div data-index="${i}" style="padding:10px 12px;border-bottom:1px solid #e5eaf2;background:${i===searchIndex?'#eef4ff':'#fff'};cursor:pointer"><b>${esc(p.name)}</b><div style="font-size:12px;color:#6b7280">Code: ${esc(p.code||'—')} | ${isPurchase?'Purchase':'Sale'}: ${money(isPurchase?(p.purchasePrice??p.price??0):(p.salePrice??p.price??0))} | Stock: ${p.stock??0}</div></div>`).join('');
  suggestionBox.classList.remove('hidden');
  suggestionBox.querySelectorAll('[data-index]').forEach(el=>el.onmousedown=e=>{e.preventDefault();addProduct(searchMatches[Number(el.dataset.index)]);});
}
searchBox.oninput=()=>{searchIndex=0;renderProductSuggestions()};
searchBox.onkeydown=e=>{
  if(e.key==='ArrowDown'&&searchMatches.length){e.preventDefault();searchIndex=Math.min(searchIndex+1,searchMatches.length-1);renderProductSuggestions();}
  else if(e.key==='ArrowUp'&&searchMatches.length){e.preventDefault();searchIndex=Math.max(searchIndex-1,0);renderProductSuggestions();}
  else if(e.key==='Enter'){e.preventDefault();if(searchMatches.length)addProduct(searchMatches[searchIndex]||searchMatches[0]);else alert('Product not found');}
  else if(e.key==='Escape'){suggestionBox.classList.add('hidden');}
};
searchBox.onblur=()=>setTimeout(()=>suggestionBox.classList.add('hidden'),200);
$('#switchType').onclick=()=>{state.invoiceType=isPurchase?'sales':'purchase';state.draftLines=[];render()};
$('#clearInvoice').onclick=()=>{state.draftLines=[];render()};
$('#saveInvoice').onclick=()=>{if(!lineData.length||lineData.some(r=>!r.productId||r.qty<=0)){alert('Select valid products and quantities.');return}for(const r of lineData){const p=db.products.find(x=>x.id===r.productId);if(!p)return alert('Invalid product');if(!isPurchase&&p.stock<r.qty)return alert('Insufficient stock: '+p.name)}let sub=lineData.reduce((s,r)=>s+r.qty*r.price,0),tax=lineData.reduce((s,r)=>s+r.qty*r.price*r.tax/100,0);const inv={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),no:$('#invNo').value,date:$('#invDate').value,customerName:list.find(x=>x.id===$('#party').value)?.name||'Walk-in',partyId:$('#party').value,type:state.invoiceType,lines:JSON.parse(JSON.stringify(lineData)),subtotal:sub,tax,total:sub+tax,status:'Saved',notes:$('#invoiceNotes').value};db.invoices.push(inv);lineData.forEach(r=>{const p=db.products.find(x=>x.id===r.productId);if(isPurchase){p.stock+=r.qty;p.purchasePrice=r.price}else p.stock-=r.qty});db.seq++;state.draftLines=[];save();alert('Invoice saved');state.page=isPurchase?'purchases':'invoices';render()};
draw();
$('#printDraft').onclick=()=>alert('Save the invoice first, then use Print.');
$('#shareDraft').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent('Invoice '+no+' from '+db.settings.company),'_blank');
}
function invoices(c){c.innerHTML=title(t('Sales History','سجل المبيعات'),t('Saved sales invoices','فواتير المبيعات المحفوظة'),'<button onclick="state.page=\'invoice\';state.invoiceType=\'sales\';render()">+ New Invoice</button>')+invoiceTable(db.invoices.filter(x=>x.type!=='purchase').slice().reverse())}
function purchases(c){c.innerHTML=title(t('Purchase Invoices','فواتير الشراء'),t('Purchase records','سجلات المشتريات'),'<button onclick="state.page=\'invoice\';state.invoiceType=\'purchase\';render()">+ New Purchase</button>')+invoiceTable(db.invoices.filter(x=>x.type==='purchase').reverse())}
function products(c){c.innerHTML=title(t('Products & Stock','المنتجات والمخزون'),t('Manage products, prices and stock','إدارة المنتجات والأسعار والمخزون'),'<button id="addProduct">+ Add Product</button>')+`<div class="toolbar"><input id="productSearch" placeholder="Search products..."></div><div id="productTable">${productTable(db.products)}</div>`;$('#addProduct').onclick=()=>productModal();$('#productSearch').oninput=e=>$('#productTable').innerHTML=productTable(db.products.filter(p=>p.name.toLowerCase().includes(e.target.value.toLowerCase())))}
function productTable(list){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Code</th><th>Name</th><th>Price</th><th>Tax</th><th>Stock</th><th>Action</th></tr></thead><tbody>${list.map(p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.tax}%</td><td>${p.stock}</td><td><button class="secondary" onclick="productModal('${p.id}')">Edit</button> <button class="danger" onclick="deleteProduct('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function editInvoice(id){const x=db.invoices.find(i=>i.id===id);if(!x)return;state.invoiceType=x.type==='purchase'?'purchase':'sales';state.draftLines=JSON.parse(JSON.stringify(x.lines||[]));state.editingId=id;alert('Draft loaded. Save as a new invoice in this version.');state.page='invoice';render()}
function deleteInvoice(id){if(!confirm('Delete this invoice?'))return;const x=db.invoices.find(i=>i.id===id);if(!x)return;if(x.type==='purchase')x.lines.forEach(r=>{const p=db.products.find(p=>p.id===r.productId);if(p)p.stock-=r.qty});else x.lines.forEach(r=>{const p=db.products.find(p=>p.id===r.productId);if(p)p.stock+=r.qty});db.invoices=db.invoices.filter(i=>i.id!==id);save();render()}
function productModal(id){const p=db.products.find(x=>x.id===id)||{id:'',code:'',name:'',price:0,purchasePrice:0,salePrice:0,tax:15,stock:0};$('#modal').classList.remove('hidden');$('#modalBox').innerHTML=`<div class="modal-head"><h2>${id?'Edit':'Add'} Product</h2><button class="ghost" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>Item Code</label><input id="pCode" value="${esc(p.code)}"></div><div class="field"><label>Product Name</label><input id="pName" value="${esc(p.name)}"></div><div class="field"><label>Default Price</label><input id="pPrice" type="number" value="${p.price}"></div><div class="field"><label>Purchase Price</label><input id="pPurchasePrice" type="number" value="${p.purchasePrice??p.price??0}"></div><div class="field"><label>Sale Price</label><input id="pSalePrice" type="number" value="${p.salePrice??p.price??0}"></div><div class="field"><label>Tax %</label><input id="pTax" type="number" value="${p.tax}"></div><div class="field"><label>Stock</label><input id="pStock" type="number" value="${p.stock}"></div></div><br><button id="saveProduct">Save Product</button>`;$('#saveProduct').onclick=()=>{const obj={id:p.id||String(Date.now()),code:$('#pCode').value,name:$('#pName').value,price:Number($('#pPrice').value),purchasePrice:Number($('#pPurchasePrice').value),salePrice:Number($('#pSalePrice').value),tax:Number($('#pTax').value),stock:Number($('#pStock').value)};if(!obj.name)return alert('Enter product name');if(id)Object.assign(p,obj);else db.products.push(obj);save();closeModal();render()}}
function deleteProduct(id){if(confirm('Delete product?')){db.products=db.products.filter(p=>p.id!==id);save();render()}}
function contacts(c){c.innerHTML=title(t('Customers & Suppliers','العملاء والموردون'),t('Manage business contacts','إدارة جهات الاتصال'),'<button id="addContact">+ Add Contact</button>')+`<div class="grid"><div class="card"><h3>Customers</h3>${contactTable(db.customers,'customer')}</div><div class="card"><h3>Suppliers</h3>${contactTable(db.suppliers,'supplier')}</div></div>`;$('#addContact').onclick=()=>contactModal()}
function contactTable(list,type){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Phone</th><th>Action</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td><button class="danger" onclick="deleteContact('${type}','${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function contactModal(){$('#modal').classList.remove('hidden');$('#modalBox').innerHTML=`<div class="modal-head"><h2>Add Contact</h2><button class="ghost" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>Type</label><select id="cType"><option value="customer">Customer</option><option value="supplier">Supplier</option></select></div><div class="field"><label>Name</label><input id="cName"></div><div class="field"><label>Phone</label><input id="cPhone"></div><div class="field"><label>Tax ID</label><input id="cTax"></div></div><br><button id="saveContact">Save</button>`;$('#saveContact').onclick=()=>{const obj={id:String(Date.now()),name:$('#cName').value,phone:$('#cPhone').value,taxId:$('#cTax').value};if(!obj.name)return alert('Enter name');(($('#cType').value==='customer')?db.customers:db.suppliers).push(obj);save();closeModal();render()}}
function deleteContact(type,id){const arr=type==='customer'?db.customers:db.suppliers;if(confirm('Delete contact?')){if(type==='customer')db.customers=arr.filter(x=>x.id!==id);else db.suppliers=arr.filter(x=>x.id!==id);save();render()}}
function reports(c){const total=db.invoices.filter(x=>x.type!=='purchase').reduce((a,x)=>a+x.total,0);c.innerHTML=title(t('Reports','التقارير'),t('Sales and business summaries','ملخصات المبيعات والأعمال'),'<button id="exportCsv">Export CSV</button>')+`<div class="grid"><div class="card"><div class="metric-label">Total Invoice Value</div><div class="metric">${money(total)}</div></div><div class="card"><div class="metric-label">Sales Count</div><div class="metric">${db.invoices.filter(x=>x.type!=='purchase').length}</div></div><div class="card"><div class="metric-label">Purchase Count</div><div class="metric">${db.invoices.filter(x=>x.type==='purchase').length}</div></div><div class="card"><div class="metric-label">Low Stock Items</div><div class="metric">${db.products.filter(x=>x.stock<5).length}</div></div></div><div class="section card"><h3>Monthly Invoice Summary</h3>${invoiceTable(db.invoices.slice().reverse())}</div>`;
$('#exportCsv').onclick=()=>{
 const rows=[['Invoice No','Date','Customer','Type','Subtotal','Tax','Total']];
 db.invoices.forEach(x=>rows.push([x.no,x.date,x.customerName,x.type,x.subtotal,x.tax,x.total]));
 const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='invoice-report.csv';a.click();
};
}
function settings(c){c.innerHTML=title(t('Settings','الإعدادات'),t('Company, branch and data settings','إعدادات الشركة والفروع والبيانات'))+`<div class="card"><div class="form-grid"><div class="field"><label>Company Name</label><input id="company" value="${esc(db.settings.company)}"></div><div class="field"><label>Default Branch</label><input id="branch" value="${esc(db.settings.branch)}"></div><div class="field"><label>Currency</label><select id="currency"><option>SAR</option><option>INR</option></select></div><div class="field"><label>Default Tax Country</label><select id="taxMode"><option value="sa">Saudi Arabia</option><option value="in">India</option></select></div></div><br><button id="saveSettings">Save Settings</button> <button class="secondary" id="exportData">Export Backup</button><button class="danger" id="resetData">Reset All Data</button></div>`;$('#currency').value=db.settings.currency;$('#taxMode').value=db.settings.taxMode;$('#saveSettings').onclick=()=>{db.settings.company=$('#company').value;db.settings.branch=$('#branch').value;db.settings.currency=$('#currency').value;db.settings.taxMode=$('#taxMode').value;save();render();alert('Settings saved')};$('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tax-invoice-backup.json';a.click()};$('#resetData').onclick=()=>{if(confirm('Reset all data?')){localStorage.removeItem('taxInvoiceProDB');location.reload()}}}
function closeModal(){$('#modal').classList.add('hidden')}
function printInvoice(id){const x=db.invoices.find(i=>i.id===id);if(!x)return;const w=window.open('','_blank');w.document.write(`<html><head><title>${x.no}</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border:1px solid #ddd;text-align:left}.total{text-align:right;font-size:20px}</style></head><body><h1>${esc(db.settings.company)}</h1><h2>Tax Invoice</h2><p>Invoice: ${esc(x.no)}<br>Date: ${esc(x.date)}<br>Customer: ${esc(x.customerName)}</p><table><tr><th>Product</th><th>Qty</th><th>Price</th><th>Tax</th><th>Amount</th></tr>${x.lines.map(r=>{const p=db.products.find(p=>p.id===r.productId);return `<tr><td>${esc(p?.name||'Item')}</td><td>${r.qty}</td><td>${money(r.price)}</td><td>${r.tax}%</td><td>${money(r.qty*r.price*(1+r.tax/100))}</td></tr>`}).join('')}</table><p class="total">Subtotal: ${money(x.subtotal)}<br>Tax: ${money(x.tax)}<br><b>Total: ${money(x.total)}</b></p><script>window.print()<\/script></body></html>`);w.document.close()}
$('#langBtn').onclick=()=>{state.lang=state.lang==='en'?'ar':'en';document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';$('#langBtn').textContent=state.lang==='en'?'العربية':'English';render()};
render();
</script>
</body>
</html>
